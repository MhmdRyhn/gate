[project]
name = "gate"
version = "0.1.0"
description = "Authentication and role-based access control service (Python port of the Go service)"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",   # uvloop + httptools event loop / HTTP parser
    "asyncpg>=0.32",
    "argon2-cffi>=25.1",
    "pyjwt[crypto]>=2.15",
    "cryptography>=50",
    "httpx>=0.28",
    "pydantic>=2.14",
    "structlog>=26.1",
    "typer>=0.27",
    "sqlalchemy[asyncio]>=2.1.6",
]

[project.scripts]
rbac-service = "gate.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.17",
    "mypy>=2.4",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101", "S105", "S106", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
# Queries splice in constant column lists only; every value is a bound $n parameter.
"src/gate/repository/postgres/*" = ["S608"]
# setting() returns dataclasses.field(...), which ruff cannot see through.
"src/gate/config/settings.py" = ["RUF009"]

[tool.mypy]
python_version = "3.15"
strict = true
packages = ["gate"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true
